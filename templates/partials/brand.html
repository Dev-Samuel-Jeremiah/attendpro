{% load static %}<div class="brand">
  <span class="brand-mark{% if not org or not org.logo or 'custom_branding' not in features %} has-logo{% endif %}">{% if org and org.logo and 'custom_branding' in features %}<img src="{{ org.logo.url }}" alt="">{% else %}<img class="ap-logo" src="{% static 'brand/mark-wide-96.webp' %}" srcset="{% static 'brand/mark-wide-192.webp' %} 2x" alt="AttendPro">{% endif %}</span>
  <div><b>{% if org %}{{ org.name }}{% else %}AttendPro{% endif %}</b><small>{% if org %}AttendPro · {{ org.code }}{% else %}by Techmiary{% endif %}</small></div>
</div>
