{% load static %}<!doctype html>
<html lang="en"{% if in_app %} class="in-app in-app-{{ app_platform }}"{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1530">
  <title>{% block title %}AttendPro{% endblock %}{% if org %} · {{ org.name }}{% endif %}</title>
  <link rel="icon" type="image/png" sizes="32x32" href="{% static 'brand/favicon-32.png' %}">
  <link rel="icon" type="image/png" sizes="192x192" href="{% static 'brand/mark-192.png' %}">
  <link rel="apple-touch-icon" href="{% static 'brand/apple-touch-icon.png' %}">
  <meta property="og:site_name" content="AttendPro">
  <meta property="og:image" content="{{ request.scheme }}://{{ request.get_host }}{% static 'brand/og-image.jpg' %}">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  {% block head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
{% block body %}{% endblock %}
<script>
/* Tables that don't fit their space (phones, or wide tables on tablets) become stacked cards,
   each cell labelled with its column heading. Re-checked when the screen is resized or rotated. */
(function () {
  var tables = Array.prototype.filter.call(document.querySelectorAll("table.table"), function (t) {
    return !t.classList.contains("no-stack") && !t.classList.contains("register") && t.querySelector("thead th");
  });
  tables.forEach(function (t) {
    var heads = Array.prototype.map.call(t.querySelectorAll("thead th"), function (th) { return th.textContent.trim(); });
    t.querySelectorAll("tbody tr").forEach(function (tr) {
      Array.prototype.forEach.call(tr.children, function (td, i) {
        if (!td.hasAttribute("data-label")) td.setAttribute("data-label", td.hasAttribute("colspan") ? "" : (heads[i] || ""));
      });
    });
  });
  function fit() {
    tables.forEach(function (t) {
      t.classList.remove("stacked");
      var box = t.parentElement;
      if (window.innerWidth <= 640 || box.scrollWidth > box.clientWidth + 1) t.classList.add("stacked");
    });
  }
  fit();
  var timer;
  window.addEventListener("resize", function () { clearTimeout(timer); timer = setTimeout(fit, 120); });
})();
</script>
{% if in_app %}<script src="{% static 'js/app-bridge.js' %}"></script>{% endif %}
{% block scripts %}{% endblock %}
</body>
</html>
