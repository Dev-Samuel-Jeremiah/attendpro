<table role="presentation" cellpadding="0" cellspacing="0" border="0" class="ap-btn" style="margin:{{ margin|default:'6px 0 0' }};"><tr>
  <td align="center" bgcolor="{% if ghost %}#ffffff{% else %}#12b886{% endif %}" style="border-radius:12px;{% if ghost %}border:1.5px solid #cfd6e6;{% endif %}">
    <a href="{{ url }}" target="_blank" style="display:inline-block;padding:15px 28px;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:16px;font-weight:700;line-height:1.2;color:{% if ghost %}#0d1530{% else %}#ffffff{% endif %};text-decoration:none;border-radius:12px;">{{ label }}</a>
  </td>
</tr></table>
