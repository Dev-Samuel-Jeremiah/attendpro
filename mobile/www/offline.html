<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>AttendPro · No connection</title>
  <style>
    html, body { margin: 0; min-height: 100%; }
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; text-align: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #f2f5fb;
      background: radial-gradient(600px 400px at 0% 0%, #213f7c 0%, transparent 60%),
                  radial-gradient(600px 400px at 100% 100%, #0b6b55 0%, transparent 58%), #0d1530; }
    .box { max-width: 340px; }
    img { width: 120px; height: auto; margin-bottom: 22px; }
    h1 { font-size: 1.5rem; margin: 0 0 8px; }
    p { color: #b9c2dd; line-height: 1.55; margin: 0 0 26px; }
    button { border: 0; border-radius: 14px; padding: 14px 30px; font: 700 1rem system-ui, sans-serif; color: #fff;
      background: linear-gradient(135deg, #17c993, #12b886 45%, #0b8a64); box-shadow: 0 12px 26px -10px rgba(18,184,134,.7); }
    small { display: block; margin-top: 18px; color: #7d88ad; }
  </style>
  <script src="app-settings.js"></script>
</head>
<body>
  <div class="box">
    <img src="logo.webp" alt="AttendPro">
    <h1>You're offline</h1>
    <p>AttendPro needs the internet to record attendance. Check your Wi-Fi or mobile data, then try again.</p>
    <button id="retry" type="button">Try again</button>
    <small id="status"></small>
  </div>
  <script>
    var url = (window.ATTENDPRO && window.ATTENDPRO.url) || "https://attendpro.cloud/app/";
    function retry() { document.getElementById("status").textContent = "Connecting…"; location.replace(url); }
    document.getElementById("retry").addEventListener("click", retry);
    window.addEventListener("online", retry);
  </script>
</body>
</html>
