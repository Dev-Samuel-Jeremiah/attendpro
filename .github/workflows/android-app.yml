# Builds the AttendPro Android app on GitHub's computers (no Android Studio needed).
#
# Run it: GitHub → this repository → Actions → "Android app" → Run workflow.
# It also runs by itself when anything in mobile/ changes on main.
#
# Every run leaves these under "Artifacts" on the run's Summary page:
#   attendpro-apk-test  → a test copy to install on your own phone
#   attendpro-apk       → the signed app (once the signing key is set up)
#   attendpro-aab       → the file for Google Play
#
# With the signing key set up (mobile/PUBLISHING.md, "Android installer on GitHub"), each build on
# main is also published on the Releases page, and this address always downloads the newest one.
# The website's "Get the app" page (/app/get/) uses it:
#   https://github.com/<owner>/<repo>/releases/latest/download/attendpro.apk
#
# Repository secrets (Settings → Secrets and variables → Actions → Secrets):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
name: Android app

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write   # to publish the app on the Releases page

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      # Every build gets a higher version number, so phones accept it as an update.
      ATTENDPRO_BUILD_NUMBER: ${{ github.run_number }}
      ATTENDPRO_RELEASE: "1"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm ci

      - name: Refuse a test build
        run: |
          if grep -q '"devUrl": "[^"]' app.settings.json; then
            echo "::error::app.settings.json has a devUrl (a test address). Clear it before building."; exit 1
          fi

      - name: Apply app.settings.json and copy plugins into the Android project
        run: node scripts/configure.mjs && npx cap sync android

      - name: Signing key
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          cat > android/keystore.properties <<PROPS
          storeFile=$RUNNER_TEMP/upload.jks
          storePassword=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}
          PROPS

      - name: Build
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease

      - name: Name the files
        working-directory: mobile/android/app/build/outputs
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          cp apk/debug/app-debug.apk "$RUNNER_TEMP/out/attendpro-test.apk"
          if [ -f apk/release/app-release.apk ]; then cp apk/release/app-release.apk "$RUNNER_TEMP/out/attendpro.apk"; fi
          cp bundle/release/*.aab "$RUNNER_TEMP/out/attendpro.aab"
          echo "APP_VERSION=$(node -p "require('${{ github.workspace }}/mobile/app.settings.json').version")" >> "$GITHUB_ENV"
          echo "APP_NOTES=$(node -p "(require('${{ github.workspace }}/mobile/app.settings.json').releaseNotes || 'Improvements and fixes.').replace(/\s+/g, ' ')")" >> "$GITHUB_ENV"
          ls -la "$RUNNER_TEMP/out"

      - uses: actions/upload-artifact@v5
        with:
          name: attendpro-apk-test
          path: ${{ runner.temp }}/out/attendpro-test.apk

      - uses: actions/upload-artifact@v5
        if: env.KEYSTORE_BASE64 != ''
        with:
          name: attendpro-apk
          path: ${{ runner.temp }}/out/attendpro.apk

      - uses: actions/upload-artifact@v5
        with:
          name: attendpro-aab
          path: ${{ runner.temp }}/out/attendpro.aab

      - name: Publish on the Releases page
        if: env.KEYSTORE_BASE64 != '' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ env.APP_VERSION }}-build${{ github.run_number }}
          name: AttendPro for Android ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            What's new: ${{ env.APP_NOTES }}

            AttendPro for Android: version ${{ env.APP_VERSION }}, build ${{ github.run_number }}.

            **Install:** download `attendpro.apk` on your Android phone, open it, allow installing from this source if asked, then tap Install.
            Already have the app? Install this over it; you stay signed in.
          files: ${{ runner.temp }}/out/attendpro.apk
