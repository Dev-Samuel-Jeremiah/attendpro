# Shared proxy settings for AttendPro.
# Install: sudo cp deploy/nginx-proxy.conf /etc/nginx/snippets/attendpro-proxy.conf
proxy_pass http://attendpro_app;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
# Overwrite (not append) so the scan log's IP address can't be faked by the client
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_redirect off;
proxy_read_timeout 120s;
