# Nginx site for AttendPro. It only answers for attendpro.cloud, so other sites
# on this server are untouched (this file deliberately has no default_server).
# Install: sudo cp deploy/nginx.conf /etc/nginx/sites-available/attendpro
#          sudo ln -s /etc/nginx/sites-available/attendpro /etc/nginx/sites-enabled/
#          sudo nginx -t && sudo systemctl reload nginx
# Then run certbot (deploy/DEPLOY.md, step 8): it adds the certificate lines
# and the http -> https redirect to this file.

upstream attendpro_app {
    server unix:/run/attendpro/gunicorn.sock fail_timeout=0;
}

# Sign-in and sign-up: at most 10 attempts a minute per address (bursts of 5)
limit_req_zone $binary_remote_addr zone=attendpro_login:10m rate=10r/m;

# www -> the bare domain
server {
    listen 80;
    listen [::]:80;
    server_name www.attendpro.cloud;
    return 301 https://attendpro.cloud$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name attendpro.cloud;

    # Logos, member photos and CSV imports
    client_max_body_size 10M;

    access_log /var/log/nginx/attendpro.access.log;
    error_log  /var/log/nginx/attendpro.error.log;

    server_tokens off;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Never serve secret files, even if one ends up in a served folder
    # (.well-known stays reachable for Let's Encrypt renewals)
    location ~ /\.(env|git|hg|svn|htaccess|htpasswd|ssh|DS_Store)(/|$) {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~ ^/(login|register)/$ {
        limit_req zone=attendpro_login burst=5 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/attendpro-proxy.conf;
    }

    # CSS, JS and the QR scanner library (python manage.py collectstatic)
    location /static/ {
        alias /srv/attendpro/static/;
        expires 30d;
        add_header Cache-Control "public";
        access_log off;
    }

    # Saved attendance reports have predictable file names; they are only
    # downloadable through the app, which checks the organisation first.
    location /media/reports/ {
        return 404;
    }

    # Organisation logos and member photos
    location /media/ {
        alias /srv/attendpro/media/;
        expires 7d;
        add_header X-Content-Type-Options nosniff;
    }

    location / {
        include /etc/nginx/snippets/attendpro-proxy.conf;
    }
}
